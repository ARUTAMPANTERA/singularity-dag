  descrizione_evento:
  - 'Aprile 1989: Franco Scaramuzzi (ENEA Frascati, fisico non chimico) annuncia una tecnica alternativa a Fleischmann-Pons
    — ''fusione a secco'', caricamento di trucioli di titanio con deuterio gassoso (non elettrolisi)'
  - Riporta produzione di neutroni 'molto superiore al fondo naturale', con cautela sulla quantità di energia (definita 'infinitesimale')
  - '1 maggio 1989: il collasso globale del cold fusion (sessione APS Baltimore, Caltech) coinvolge anche il caso italiano
    — ma a differenza di molti altri gruppi, ENEA Frascati CONTINUA la ricerca per oltre un decennio'
  - 'Anni ''90-2000: il gruppo (De Ninno, Frattolillo, Violante, Scaramuzzi) sposta il focus dalla rilevazione neutroni alla
    calorimetria, riportando ''evidenza convincente'' di calore in eccesso — mai accettata come conclusiva dalla fisica mainstream'
  - '1999: Carlo Rubbia (Nobel 1984) diventa presidente ENEA, mostra interesse scientifico per il filone di ricerca'
