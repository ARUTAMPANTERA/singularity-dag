  nazione: FR
  field: Fisica — caso fondante della 'scienza patologica'
  status: REFUTATO_SPERIMENTALMENTE
  certezza: altissima
  si_score: 0.0
  uq: 0.97
  nota_classificazione: '[CONTROLLO_NEGATIVO] Il caso più puro di scienza patologica auto-illusoria nella storia della fisica.
    Serve a calibrare il sistema: dimostra che effetti ''osservati'' da decine di scienziati competenti possono essere puro
    bias soggettivo, smascherabile con un singolo test in doppio cieco ben progettato.'
  tags_frattali:
  - '#Nrays'
  - '#Blondlot'
  - '#RobertWood'
  - '#ScienzaPatologica'
  fonti_primarie:
  - fonte: 'Blondlot R.: Rayons N (Comptes Rendus, 1903-1904, 23+ articoli)'
    uq: 0.95
    status: PUBBLICO
  - fonte: 'Wood R.W.: The n-rays (Nature, settembre 1904) — report dell''esposizione'
    uq: 0.98
    status: PUBBLICO
  fonti_secondarie:
  - fonte: 'Langmuir I.: Pathological Science (conferenza 1953, trascritta General Electric, pubblicata 1989 Physics Today)
      — coniò il termine usando N-rays come caso fondante'
    uq: 0.92
  descrizione_evento:
  - '1903: Blondlot (Università di Nancy, membro Accademia Francese delle Scienze) annuncia la scoperta dei ''raggi N'' —
    radiazione rilevabile solo tramite leggero aumento di luminosità su un filo trattato con solfuro di calcio'
  - '1903-1904: circa 120 ricercatori, inclusi nomi di rilievo (Lord Kelvin tentò ma fallì), riportano di aver confermato
    l''effetto. 300+ pubblicazioni in pochi mesi. L''Accademia Francese assegna a Blondlot il prestigioso Prix Leconte (20.000
    franchi)'
  - 'Estate 1904: la rivista Nature invia il fisico americano Robert W. Wood a Nancy per investigare, dopo che nessuno al
    meeting della British Association (Cambridge 1904) era riuscito a replicare l''effetto'
  - Wood, al buio durante la demo, rimuove di nascosto il prisma di alluminio essenziale per l'esperimento e lo mette in tasca.
    Blondlot e il suo assistente CONTINUANO a riportare di osservare i raggi N — anche senza il componente che li avrebbe
    dovuti generare
  - 'Wood pubblica su Nature (settembre 1904): i raggi N sono un''illusione soggettiva. Il campo di ricerca collassa quasi
    istantaneamente'
  domande_aperte_da_chiudere: []
  aion_strati:
    sigma0: René Blondlot (1849-1930), fisico francese rispettato, già noto per aver confermato sperimentalmente nel 1891
      che le onde radio viaggiano alla velocità della luce. [DATO UQ=0.95]
    sigma3: L'effetto N-ray era rilevabile solo tramite giudizio soggettivo umano (variazione di luminosità appena percettibile)
      — nessuna strumentazione oggettiva di misura. [DATO UQ=0.95]
    sigma7: Il test di Wood (rimozione segreta del prisma) dimostrò in modo definitivo che l'effetto era bias cognitivo/aspettativa,
      non un fenomeno fisico reale. Caso fondante del concetto di 'scienza patologica' (Langmuir, 1953). [DATO UQ=0.97]
  impatto_storico: Caso di riferimento assoluto nella metodologia scientifica per illustrare come l'autoillusione collettiva
    possa produrre 'confirmazioni' multiple di un effetto inesistente, e come un singolo test ben progettato (rimozione del
    componente chiave) possa smascherarlo definitivamente.
  valore_per_il_sistema: Controllo negativo essenziale per il Filtro Entropico (SI_Calibration v4) — dimostra che il sistema
