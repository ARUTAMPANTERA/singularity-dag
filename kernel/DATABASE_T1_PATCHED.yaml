- id: T1-025
  nome: Oliver Heaviside
  tipo_nodo: SCIENZIATO
  categoria: GATEKEEPER_CONTESTATO
  periodo: 1850-1925
  nazione: GB
  field: Ingegneria elettrica / Matematica applicata / Elettromagnetismo
