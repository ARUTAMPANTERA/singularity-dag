  ciclo_17_fase: 7
  tags_frattali:
  - '#Heaviside'
  - '#MaxwellEquations'
  - '#ScalarWaveContested'
  nota_classificazione: '[IMPORTANTE] La riformulazione di Maxwell in 4 equazioni vettoriali è [DATO] storiograficamente consolidato
    (Hunt 1991, ''The Maxwellians'') e trattato come SEMPLIFICAZIONE PRATICA per l''ingegneria, non soppressione. Il claim
    che abbia ''eliminato componenti scalari/longitudinali'' e'' [IPOTESI MINORITARIA] proveniente dalla sottocultura scalar-wave
    (Tom Bearden e seguaci) — NON storiografia mainstream.'
  l_minus_1_precursors:
  - James Clerk Maxwell (20 equazioni originali in notazione quaternionica/componenti)
  l_plus_1_heirs:
  - Ingegneria elettrica moderna (le 4 equazioni vettoriali sono lo standard universale)
  - '[IPOTESI] Tom Bearden e scalar electromagnetics community'
  fonti_primarie:
  - fonte: 'Heaviside O.: Electromagnetic Theory (3 voll., 1893-1912)'
    uq: 0.95
    status: PUBBLICO
  - fonte: 'Hunt B.J.: The Maxwellians (Cornell University Press, 1991) — storiografia standard di riferimento'
    uq: 0.92
    status: PUBBLICO
  evento_storiografico:
  - '[DATO] 1880s-1890s: Heaviside (insieme a Gibbs, indipendentemente) riformula le 20 equazioni originali di Maxwell (in
    notazione per componenti/quaternioni) in 4 equazioni vettoriali compatte — oggi standard universale nei testi di fisica'
  - '[DATO] Storiografia mainstream (Hunt 1991, Nahin ''Oliver Heaviside: Sage in Solitude'' 1988) tratta questo come un contributo
    di chiarificazione matematica essenziale per l''ingegneria elettrica pratica'
  - '[IPOTESI MINORITARIA — NON CONFERMATA] Claim della comunità scalar-wave: la riduzione avrebbe eliminato termini scalari/longitudinali
    presenti nella formulazione quaternionica originale di Maxwell, con potenziali implicazioni per tecnologie energetiche
    non convenzionali'
  domande_aperte_da_chiudere:
  - Esiste una derivazione matematica rigorosa, pubblicata su rivista peer-reviewed di elettromagnetismo, che dimostri la
    perdita di soluzioni fisicamente significative nella riduzione vettoriale di Heaviside? [Ricerca non trovata al momento
    — il claim resta IPOTESI]
  aion_strati:
    sigma0: Oliver Heaviside (1850-1925). Ingegnere e matematico autodidatta britannico. [DATO UQ=0.97]
    sigma3: Riformulò le equazioni di Maxwell in notazione vettoriale (4 equazioni), introdusse l'analisi operazionale, predisse
      la ionosfera (strato di Heaviside). [DATO UQ=0.95]
    sigma7: La sua riformulazione divenne lo standard didattico e ingegneristico mondiale entro il 1900. [DATO UQ=0.90]
    sigma11: Il claim di 'eliminazione' di componenti scalari e' una IPOTESI non verificata, originaria di letteratura scalar-wave
      (Bearden), priva finora di dimostrazione matematica pubblicata in sede peer-reviewed accademica. [IPOTESI 15% UQ=0.15]
    sigma13: '[SPECULAZIONE grado 5/10] Possibili ''tecnologie energetiche scalari'' bloccate dalla semplificazione di Heaviside.
      Non falsificabile con framework fisico attuale.'
  impatto_storico: Le 4 equazioni vettoriali di Heaviside-Gibbs sono il fondamento didattico universale dell'elettromagnetismo
    classico. Il claim di soppressione resta confinato a letteratura non-accademica.
