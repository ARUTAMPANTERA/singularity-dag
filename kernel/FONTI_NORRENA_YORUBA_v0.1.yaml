# 3. NOTE COMPARATIVE PRELIMINARI (non CT-05)
# ═══════════════════════════════════════════════════════════════════════════
note_comparative_preliminari:
  - |
    Odin: acquisizione di conoscenza tramite auto-sacrificio estremo (corpo).
    Limitazione = prezzo permanente. Nessun esilio da terzi.
  - |
    Ogun: dono di tecnologia (ferro) + auto-ritiro dopo che la stessa forza
    produce distruzione. Confine auto-tracciato.
  - |
    Entrambi differiscono da Quetzalcoatl (dono + esilio forzato da rivale)
    e dal pattern cinese Gun/Yu (furto + esecuzione + erede che completa).
  - |
    Null-hypothesis: nessuno dei due è riducibile al generico "dono di conoscenza".
    La struttura specifica (prezzo/ritiro) è ciò che va testato nel triangolo.

lacune_dichiarate:
  - "Testi Yoruba orali primari non accessibili in forma scritta pre-coloniale; fonti coloniali/post-coloniali e raccolte moderne."
  - "Hávamál è testo islandese del XIII sec. basato su tradizione orale più antica; datazione precisa del motivo auto-sacrificio resta dibattuta."
  - "Nessuna fonte primaria pre-cristiana diretta per il rituale completo di Odin."

