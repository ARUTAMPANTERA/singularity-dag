  data_accesso: "2026-08-09 / 2026-08-10"
  principio: |
    Null-hypothesis STRICT applicato PRIMA di qualsiasi claim di pattern.
    Struttura da testare (identica a Cina Gun/Yu):
      [1] Furto/trasferimento di un mezzo tecnico specifico
      [2] Esecuzione/sanzione diretta dell'agente
      [3] Erede/successore che completa l'opera
      [4] Fondazione di qualcosa (civiltà, ordine, istituzione)
    Pattern generici ("dono di conoscenza", "eroe culturale") = DEBOLI,
    stesso problema del diluvio (score ~0.42). Scartati.
