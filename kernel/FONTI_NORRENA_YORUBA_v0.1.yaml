# ═══════════════════════════════════════════════════════════════════════════
# 1. NORRENA — Odin e le rune (sacrificio di sé per conoscenza)
# ═══════════════════════════════════════════════════════════════════════════
norrena_odin_rune:

  - id: NOR-001
    titolo: "Hávamál (Poetic Edda) — Odin's self-sacrifice for the runes"
    url: "http://www.germanicmythology.com/works/ThorpeEdda/thorpe07.html"
    data_accesso: "2026-08-09"
    tier: "TIER_0"
    tipo: "primaria (traduzione inglese di testo antico norreno, Hávamál 138-141)"
    citazione: |
      "I know that I hung, on a wind-rocked tree, nine whole nights, with a spear wounded, and to Odin offered, myself to myself; on that tree, of which no one knows from what root it springs."
      "Bread no one gave me, nor a horn of drink, downward I peered, to runes applied myself, wailing learnt them, then fell down thence."
      "Then I began to bear fruit, and to know many things, to grow and well thrive: word by word I sought out words, fact by fact I sought out facts."
    nota: |
      Fonte primaria. Odin si sacrifica a se stesso (gefinn Óðni, sjálfur sjálfum mér)
      per ottenere le rune. Non è "dono" da un altro dio, ma conquista tramite
      auto-sacrificio. Limitazione: il prezzo è il dolore, la sospensione, la ferita.

  - id: NOR-002
    titolo: "Norse Mythology for Smart People — Odin's Discovery of the Runes"
    url: "https://norse-mythology.org/tales/odins-discovery-of-the-runes/"
    data_accesso: "2026-08-09"
    tier: "TIER_1"
    tipo: "secondaria (sintesi basata su Hávamál)"
    citazione: |
      "Odin hung himself from a branch of Yggdrasil, pierced himself with his spear, and peered downward into the shadowy waters below. ... At the end of the ninth night, he at last perceived shapes in the depths: the runes!"
      "Having been initiated into the mysteries of the runes, Odin recounted: Then I was fertilized and became wise; I truly grew and thrived."
    nota: "Conferma del motivo auto-sacrificio → acquisizione di conoscenza runica."

  - id: NOR-003
    titolo: "Mímir — Wikipedia (eye sacrifice + head of knowledge)"
    url: "https://en.wikipedia.org/wiki/M%C3%ADmir"
    data_accesso: "2026-08-09"
    tier: "TIER_1"
    tipo: "secondaria (sintesi fonti Eddiche)"
    citazione: |
      "Odin took the head of Mímir, embalmed it with herbs so that it would not rot, and spoke charms over it, which gave it the power to speak to him and reveal to him secrets."
      "Stanza 28 references Odin's sacrifice of his eye to Mímir's Well..."
    nota: |
      Secondo motivo di acquisizione conoscenza: sacrificio dell'occhio al pozzo di Mímir.
      Conoscenza ottenuta a prezzo fisico permanente. Non esilio, ma limitazione corporea.

  null_hypothesis_norrena:
    struttura_specifica: |
      Auto-sacrificio (impiccagione + spearing + digiuno 9 notti) → acquisizione rune.
      Oppure: sacrificio di un occhio → accesso al pozzo di Mímir.
      Prezzo permanente (corpo mutilato). Trasmissione successiva agli umani via Odin.
    pattern_generico_debole: |
      "Dio che dà conoscenza" isolato. Quasi universale e non discriminante.
    esilio: |
      Non presente in forma di esilio forzato da altri dei. Odin resta in Asgard.
      Limitazione = auto-imposta (prezzo del sapere). Loki ha traiettorie di legame/punizione,
      ma non è il donatore primario di tecnologia scrittoria.

# ═══════════════════════════════════════════════════════════════════════════
# 2. YORUBA — Ogun (ferro, tecnologia, ritiro nel bosco)
# ═══════════════════════════════════════════════════════════════════════════
yoruba_ogun:

  - id: YOR-001
    titolo: "Mythopedia — Ogun"
    url: "https://mythopedia.com/topics/ogun/"
    data_accesso: "2026-08-09"
    tier: "TIER_1"
    tipo: "secondaria"
    citazione: |
      "Ogun is revered for having given humans the gift of iron and the knowledge of forging and metalwork. In exchange for these gifts, he ‘demands justice, fair play, and integrity.’"
      "Ogun told them it was iron, and that he had learned the secrets of the metal from Orunmila, the god of divination."
    nota: "Dono esplicito di ferro e tecnica di forgiatura. Collegamento con Orunmila."

  - id: YOR-002
    titolo: "Old Folklore — Ọgún: Yoruba Orisa of Iron, War, and the Open Road"
    url: "https://oldfolklore.com/ogun-the-orisa-of-iron-war-and-the-opened-path-yoruba-mythology/"
    data_accesso: "2026-08-09"
    tier: "TIER_1"
    tipo: "secondaria"
    citazione: |
      "He crafted for them the first tools: hoes for the farmers, knives for hunters, and the anvil and hammer for the smiths. Through iron, he gave humanity mastery over the physical world."
      "Horrified at the destruction wrought during a celebration in his name, Ọgún retreated deep into the forest, vowing never again to dwell openly among humans."
    nota: |
      Dono di strumenti (tecnologia) + ritiro volontario nel bosco dopo violenza
      scatenata dal suo stesso potere. Non esilio imposto da altri orisha, ma auto-ritiro.

  - id: YOR-003
    titolo: "Hitchhiker's Guide to Religion — Ogun and the City He Cannot Live In"
    url: "https://www.hitchhikersguidetoreligion.com/stories/ogun-iron-deity/"
    data_accesso: "2026-08-09"
    tier: "TIER_1"
    tipo: "secondaria narrativa"
    citazione: |
      "This is not a god who has been punished or defeated or overcome by a rival. He is not exiled by Orunmila or Obatala or any other orisha. He exiles himself... I cannot promise you it will not happen again."
      "The forest where Ogun lives is not a punishment. It is a boundary he drew for himself, the boundary between the force that makes civilization possible and the civilization that cannot safely contain that force."
    nota: "Chiarimento critico: auto-esilio, non punizione esterna. Confine tra forza civilizzatrice e rischio distruttivo."

  - id: YOR-004
    titolo: "Encyclopedia of the Yoruba (estratto) — Ogun and iron"
    url: "https://dokumen.pub/encyclopedia-of-the-yoruba-0253021332-9780253021335-9780253021441.html"
    data_accesso: "2026-08-09"
    tier: "TIER_1"
    tipo: "secondaria (voce enciclopedica)"
    citazione: |
      "It was Ògún who introduced iron with a ringing sound to the world. ... It was Ògún who forged iron continuously, Till he reached the expanse of heaven."
    nota: "Attribuzione esplicita dell'introduzione del ferro a Ogun."

  null_hypothesis_yoruba:
    struttura_specifica: |
      Ogun porta/scopre il ferro e insegna la forgiatura → civiltà (strumenti, armi, strade).
      Dopo violenza scatenata dal suo potere, si ritira volontariamente nel bosco.
      Resta accessibile tramite culto, ma non abita più apertamente tra gli umani.
    pattern_generico_debole: |
      "Dio della tecnologia" isolato. Presente in molte culture metallurgiche.
    esilio: |
      Auto-ritiro (non imposto da rivale). Differisce da Quetzalcoatl (esilio da Tezcatlipoca)
      e da Prometeo (catena da Zeus). Più vicino a un confine auto-imposto tra forza e ordine.

