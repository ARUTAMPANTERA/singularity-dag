# ═══════════════════════════════════════════════════════════════════════════
# NULL-HYPOTHESIS STRICT — NORRENA (Odin / rune)
# ═══════════════════════════════════════════════════════════════════════════
norrena_odin:
  struttura_testata:
    1_mezzo_tecnico_specifico:
      elemento: "Rune (sistema di scrittura/magia)"
      presente: true
      fonte: "Hávamál 138-141 (TIER_0)"
      null_hypothesis_score: "MEDIO"
      nota: "Le rune sono un mezzo tecnico specifico. Tuttavia la loro acquisizione è auto-scoperta, non furto da un detentore esterno."

    2_esecuzione_sanzione_diretta:
      elemento: "Auto-sacrificio (impiccagione + spearing + digiuno 9 notti)"
      presente: true
      fonte: "Hávamál 138-139"
      null_hypothesis_score: "DEBOLE-MEDIO"
      nota: |
        È sanzione, ma AUTO-imposta ("myself to myself"). Non esecuzione
        da parte di un'autorità superiore o rivale. Differisce strutturalmente
        dall'esecuzione di Gun o dalla catena di Prometeo.

    3_erede_successore_completa:
      elemento: "Erede che completa l'opera delle rune"
      presente: false
      null_hypothesis_score: "DEBOLE (assente)"
      nota: |
        Odin acquisisce e usa le rune. Non c'è un successore che completa
        un'opera interrotta dopo la sanzione. I figli di Odin (Thor, etc.)
        non completano il progetto runico. Assenza critica.

    4_fondazione:
      elemento: "Fondazione di ordine/civiltà tramite le rune"
      presente: parziale
      null_hypothesis_score: "MEDIO"
      nota: "Odin trasmette conoscenza; le rune fondano pratica magico-scrittoria. Ma non c'è 'fondazione dopo sanzione + erede'."

  verdetto_struttura_4_parti: "NON_MATCH completo. Presenti 1 e (auto)2; assente 3; 4 debole."
  pattern_generico_scartato: "'Dono di conoscenza' / 'dio che cerca sapere' = troppo comune cross-culturalmente → DEBOLE (come diluvio)."
  anacronismi_verificati:
    - "Rune storiche: alfabeto germanico, attestazione archeologica da ~II-III sec. d.C. Il mito le proietta in tempo primordiale. Accettabile come mito, non come datazione storica."
  ct05_precheck: "OK_caveat — struttura non allineata al template 4-parti di Gun/Yu. Usabile solo come contrasto, non come vertice identico."

# ═══════════════════════════════════════════════════════════════════════════
# NULL-HYPOTHESIS STRICT — YORUBA (Ogun / ferro)
# ═══════════════════════════════════════════════════════════════════════════
yoruba_ogun:
  struttura_testata:
    1_mezzo_tecnico_specifico:
      elemento: "Ferro + tecnica di forgiatura"
      presente: true
      fonte: "Tradizione Yoruba (Mythopedia, Encyclopedia of the Yoruba, Old Folklore)"
      null_hypothesis_score: "MEDIO-ALTO"
      nota: "Mezzo tecnico concreto e civilizzatore. Coerente."

    2_esecuzione_sanzione_diretta:
      elemento: "Auto-ritiro nel bosco dopo violenza"
      presente: true (ma auto)
      null_hypothesis_score: "DEBOLE-MEDIO"
      nota: |
        È ritiro, non esecuzione o sanzione imposta da rivale/autorità.
        Ogun si ritira da solo. Differisce da esilio forzato (Quetzalcoatl)
        e da esecuzione (Gun).

    3_erede_successore_completa:
      elemento: "Erede che completa l'opera del ferro"
      presente: false / debole
      null_hypothesis_score: "DEBOLE (assente o non strutturale)"
      nota: |
        In alcune versioni Oranyan sposta Ogun / prende potere, ma non
        'completa' l'opera tecnica del ferro dopo una sanzione.
        Non c'è successione funzionale post-sanzione.

    4_fondazione:
      elemento: "Fondazione di civiltà tramite ferro (strumenti, strade, armi)"
      presente: true
      null_hypothesis_score: "MEDIO-ALTO"
      nota: "Ogun è esplicitamente civilizzatore tramite il ferro."

  verdetto_struttura_4_parti: "NON_MATCH completo. Presenti 1 e 4; 2 è auto-ritiro (non sanzione esterna); 3 assente."
  pattern_generico_scartato: "'Dio della tecnologia / eroe culturale' = troppo comune → DEBOLE."
  anacronismi_verificati:
    - "Metallurgia del ferro in West Africa: presente e antica (prima del 1000 a.C. in alcune aree). Non anacronismo grave come Mesoamerica."
  ct05_precheck: "OK_caveat — struttura non allineata al template 4-parti di Gun/Yu. Usabile come contrasto (dono + auto-confine), non come vertice identico."

