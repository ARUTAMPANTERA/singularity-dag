  quetzalcoatl:
    match_4_parti: "PARZIALE (dono + esilio forzato da Tezcatlipoca; manca erede che completa)"
  odin:
    match_4_parti: "BASSO (auto-acquisizione + auto-prezzo; manca erede e sanzione esterna)"
  ogun:
    match_4_parti: "BASSO-MEDIO (dono tecnico + auto-ritiro + fondazione; manca erede e sanzione esterna)"

  conclusione_operativa: |
    Né Norrena né Yoruba matchano la struttura 4-parti completa isolata
    per la Cina. Entrambi falliscono sul punto 3 (erede che completa)
    e presentano sanzione/ritiro AUTO-imposto invece di esecuzione esterna.
    Per /triangolo: possono entrare solo come CONTRASTI o come pattern
    affini ma non identici. Non come vertici equivalenti.
    is_universal_pattern rimane false.

